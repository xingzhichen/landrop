name: landrop
description: Cross-platform LAN file sharing and uploads with named transfers.
publish_to: none
version: 1.3.0+6

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.4.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.0
  path_provider: ^2.1.0
  archive: ^4.0.7
  characters: ^1.4.1
  path: ^1.9.1

dev_dependencies:
  cross_file: ^0.3.5+5
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
