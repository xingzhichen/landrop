name: landrop
description: Cross-platform LAN file sharing with QR download pages.
publish_to: none
version: 1.1.1+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.4.0
  cross_file: ^0.3.5+5
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
