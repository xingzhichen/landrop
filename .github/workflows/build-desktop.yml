name: Build desktop apps

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-latest
            target: macos
          - platform: Windows
            runner: windows-latest
            target: windows
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze source
        run: flutter analyze
      - name: Run tests on macOS
        if: matrix.target == 'macos'
        run: flutter test
      - name: Run tests on Windows with failure details
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $lines = & flutter test --reporter=json 2>&1
          $testExit = $LASTEXITCODE
          $events = @()
          foreach ($line in $lines) {
            $text = $line.ToString()
            Write-Output $text
            try { $events += ($text | ConvertFrom-Json -ErrorAction Stop) } catch { }
          }
          if ($testExit -ne 0) {
            $testNames = @{}
            foreach ($event in $events) {
              if ($event.type -eq 'testStart' -and $event.test.id -ne $null) {
                $testNames[[string]$event.test.id] = $event.test.name
              }
            }
            foreach ($event in $events) {
              if ($event.type -eq 'testDone' -and $event.result -eq 'failure') {
                $id = [string]$event.testID
                $name = $testNames[$id]
                if (-not $name) { $name = "testID=$id" }
                Write-Output "::error title=Flutter test failure::$name"
              }
              if ($event.type -eq 'error' -and $event.error) {
                $message = ($event.error -replace '[\r\n]+', ' ')
                Write-Output "::error title=Flutter test detail::$message"
              }
            }
          }
          exit $testExit
      - name: Build release
        run: flutter build ${{ matrix.target }} --release
      - name: Sign and package macOS application
        if: matrix.target == 'macos'
        run: bash tool/package_macos.sh
      - name: Package Windows application
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/LanDrop-Windows.zip -Force
      - name: Upload macOS app
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: LanDrop-macOS
          path: flutter_app/build/LanDrop-macOS.zip
          if-no-files-found: error
      - name: Upload Windows app
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: LanDrop-Windows
          path: flutter_app/build/LanDrop-Windows.zip
          if-no-files-found: error
