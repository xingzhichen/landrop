name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-15
            target: macos
          - platform: Windows
            runner: windows-2025
            target: windows
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: flutter_app
    steps:
      # Pin actions to immutable commits; Dependabot tracks new releases.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify tag matches app version
        shell: bash
        run: bash tool/verify_release_version.sh "$GITHUB_REF_NAME"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.10.0'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze source
        run: flutter analyze --no-pub
      - name: Run tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: flutter test --no-pub
      - name: Build release
        run: flutter build ${{ matrix.target }} --release --no-pub
      - name: Sign and package macOS application
        if: matrix.target == 'macos'
        run: bash tool/package_macos.sh
      - name: Package Windows application
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/LanDrop-Windows.zip -Force
      - name: Upload release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LanDrop-${{ matrix.platform }}
          path: flutter_app/build/LanDrop-${{ matrix.platform }}.zip
          if-no-files-found: error

  publish:
    name: Publish release and assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: LanDrop-*
          path: dist
          merge-multiple: true
      - name: Test release archive verification
        env:
          TMPDIR: ${{ runner.temp }}
        run: bash flutter_app/tool/test_release_archives.sh
      - name: Verify release ZIPs and generate SHA-256 checksums
        env:
          VERIFIED_RELEASE_DIR: ${{ runner.temp }}/landrop-verified-release
        run: bash flutter_app/tool/verify_release_archives.sh dist "$VERIFIED_RELEASE_DIR"
      - name: Test retry-safe release publisher
        run: bash flutter_app/tool/test_publish_release.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RELEASE_DIR: ${{ runner.temp }}/landrop-verified-release
        run: >-
          bash flutter_app/tool/publish_release.sh "$GITHUB_REF_NAME"
          "$VERIFIED_RELEASE_DIR/LanDrop-macOS.zip"
          "$VERIFIED_RELEASE_DIR/LanDrop-Windows.zip"
          "$VERIFIED_RELEASE_DIR/SHA256SUMS"
